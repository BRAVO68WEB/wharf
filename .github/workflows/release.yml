name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  channel:
    name: Channel
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.check.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a stable tag on main or a preview tag on dev
        id: check
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          git fetch origin main dev
          sha=$(git rev-parse HEAD)
          on_main=0
          on_dev=0
          git merge-base --is-ancestor "$sha" origin/main && on_main=1 || true
          git merge-base --is-ancestor "$sha" origin/dev && on_dev=1 || true
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            if [[ "$on_main" -ne 1 ]]; then
              echo "Stable tag $tag must point at a commit on main."
              exit 1
            fi
            echo "name=stable" >> "$GITHUB_OUTPUT"
          elif [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(rc|preview)\.[0-9]+$ ]]; then
            if [[ "$on_dev" -ne 1 ]]; then
              echo "Preview tag $tag must point at a commit on dev."
              exit 1
            fi
            echo "name=preview" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $tag is not a release tag."
            echo "Use vX.Y.Z on main, or vX.Y.Z-rc.N / vX.Y.Z-preview.N on dev."
            exit 1
          fi

  binaries:
    name: Binaries
    needs: channel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Publish GitHub Release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Image
    needs: channel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/bravo68web/wharf
            bravo68web/wharf
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.channel.outputs.name == 'stable' }}
            type=semver,pattern={{major}},enable=${{ needs.channel.outputs.name == 'stable' }}
          flavor: |
            latest=${{ needs.channel.outputs.name == 'stable' && 'auto' || 'false' }}

      - name: Image version
        id: ver
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.ver.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
