# Local dev stack: Wharf + MinIO (S3-compatible blob store).
#
#   docker compose up --build        # registry on http://localhost:5000
#   docker compose down -v           # wipe dev state
#
# MinIO note: the minio/minio Docker Hub image was removed and quay.io now
# requires authentication, so this stack pins the frozen Bitnami legacy
# mirror of MinIO. It is a dev dependency only — production uses real S3 or
# any S3-compatible endpoint via storage.s3 in the registry config.
#
# All credentials below are DEV-ONLY. The registry never stores secrets in
# its config file: it reads them from the environment names the config names.

services:
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: wharf-minio
      MINIO_ROOT_PASSWORD: wharf-minio-secret
      # Bitnami convenience: creates the bucket the registry targets.
      MINIO_DEFAULT_BUCKETS: registry-blobs
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  registry:
    build:
      # Build context is the repository root (see deploy/Dockerfile header).
      context: ..
      dockerfile: deploy/Dockerfile
    image: wharf:dev
    ports:
      # Host port overridable: macOS AirPlay Receiver binds :5000 on some
      # dev boxes (WHARF_HOST_PORT=5001 docker compose up).
      - "${WHARF_HOST_PORT:-5000}:5000"
    environment:
      REGISTRY_SESSION_SECRET: dev-only-session-secret-padding!!
      REGISTRY_S3_ACCESS_KEY: wharf-minio
      REGISTRY_S3_SECRET_KEY: wharf-minio-secret
      # DEV-ONLY bootstrap admin (docker login / dashboard login).
      REGISTRY_ADMIN_USER: admin
      REGISTRY_ADMIN_PASSWORD: wharf-admin-secret
    volumes:
      # S3/MinIO variant of the config (the image default is filesystem).
      - ./config.compose.yml:/etc/registry/config.yml:ro
      # SQLite metadata (blobs live in MinIO).
      - registry-data:/var/lib/registry
    depends_on:
      minio:
        condition: service_healthy

volumes:
  minio-data:
  registry-data:
