# Registry configuration for the docker-compose local dev stack: blobs go to
# MinIO over the s3 driver, metadata stays in SQLite on a named volume.
# Mounted over /etc/registry/config.yml by deploy/docker-compose.yml.
#
# Secrets never live in this file: the compose stack passes REGISTRY_SESSION_SECRET,
# REGISTRY_S3_ACCESS_KEY and REGISTRY_S3_SECRET_KEY via the environment.

server:
  port: 5000
  read_timeout: 0s
  write_timeout: 0s
  max_upload_size: 0

storage:
  type: s3
  s3:
    # MinIO service from deploy/docker-compose.yml (path-style required).
    endpoint: http://minio:9000
    region: us-east-1
    bucket: registry-blobs
    access_key_env: REGISTRY_S3_ACCESS_KEY
    secret_key_env: REGISTRY_S3_SECRET_KEY
    force_path_style: true

database:
  path: /var/lib/registry/registry.db

auth:
  jwt:
    # Auto-generated on first start if the file is missing (mode 0600).
    private_key_path: /var/lib/registry/jwt_private.pem
    issuer: better-docker-registry
    service: registry.docker.io
    token_ttl: 15m
  session:
    secret_env: REGISTRY_SESSION_SECRET
    ttl: 24h

gc:
  batch_size: 256

logging:
  level: info
